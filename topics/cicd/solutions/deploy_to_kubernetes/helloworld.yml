apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-blue-whale
  namespace: "{{ app_namespace }}"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world-app
  template:
    metadata:
      labels:
        app: hello-world-app
    spec:
      containers:
        - name: hello-whale-container
          image: "{{ app_image }}"
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: "{{ app_namespace }}"
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: hello-world-app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  namespace: "{{ app_namespace }}"
spec:
  ingressClassName: "{{ ingress_class }}"
  tls:
    - hosts: ["{{ app_host }}"]
      secretName: tls-secret
  rules:
    - host: "{{ app_host }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
