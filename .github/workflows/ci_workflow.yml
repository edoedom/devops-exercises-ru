name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-dev.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/run_ci.sh
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module:
          - topics/aws/exercises/new_vpc/terraform
          - topics/aws/exercises/subnets/terraform
          - topics/aws/exercises/s3/new_bucket/terraform
          - topics/aws/exercises/web_app_lambda_dynamodb/terraform
          - topics/gcp/exercises/instance_101
          - topics/gcp/exercises/create_project
          - topics/gcp/exercises/assign_roles
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - run: terraform fmt -check -no-color
      - run: terraform init -backend=false -input=false -no-color
      - run: terraform validate -no-color
