- name: Deploy the web application from the Ansible controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_namespace: default
    app_host: hello-world.app
  tasks:
    - name: Check deployment inputs
      ansible.builtin.assert:
        that:
          - app_image is defined and app_image | length > 0
          - ingress_class is defined and ingress_class | length > 0
          - tls_cert_file is defined and tls_cert_file | length > 0
          - tls_key_file is defined and tls_key_file | length > 0
        fail_msg: Supply app_image, ingress_class, tls_cert_file and tls_key_file.
    - name: Ensure namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ app_namespace }}"
    - name: Apply TLS secret in the application namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: tls-secret
            namespace: "{{ app_namespace }}"
          type: kubernetes.io/tls
          data:
            tls.crt: "{{ lookup('ansible.builtin.file', tls_cert_file) | b64encode }}"
            tls.key: "{{ lookup('ansible.builtin.file', tls_key_file) | b64encode }}"
      no_log: true
    - name: Apply the workload, service and ingress
      kubernetes.core.k8s:
        state: present
        template: "{{ playbook_dir }}/helloworld.yml"
        namespace: "{{ app_namespace }}"
        wait: true
        wait_timeout: 180
